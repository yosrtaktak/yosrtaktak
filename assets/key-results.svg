<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" font-family="JetBrains Mono, Consolas, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/><stop offset="1" stop-color="#164E63"/>
    </linearGradient>
    <style>
      .tile { fill:#0B1220; stroke:#22D3EE; stroke-opacity:.45; stroke-width:1.5; }
      .num  { font-size:30px; font-weight:700; fill:#22D3EE; }
      .lbl  { font-size:12px; fill:#CBD5E1; }
      .sub  { font-size:10px; fill:#64748B; }
      .t { opacity:0; animation: in .8s ease-out forwards; }
      @keyframes in { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)} }
    </style>
  </defs>
  <rect width="900" height="270" rx="16" fill="url(#bg)"/>
  <text x="24" y="30" fill="#67E8F9" font-size="13" letter-spacing="2">RELIABILITY PLATFORM · KEY RESULTS</text>

  <g class="t" style="animation-delay:.1s"><rect class="tile" x="24" y="48" width="274" height="96" rx="12"/>
    <text class="num" x="42" y="88">11</text><text class="lbl" x="42" y="110">microservices on K3s</text><text class="sub" x="42" y="128">e-commerce platform, Istio Ambient + strict mTLS</text></g>
  <g class="t" style="animation-delay:.25s"><rect class="tile" x="313" y="48" width="274" height="96" rx="12"/>
    <text class="num" x="331" y="88">5 SLOs</text><text class="lbl" x="331" y="110">99% to 99.95% targets</text><text class="sub" x="331" y="128">user-centric SLIs measured at mesh L7</text></g>
  <g class="t" style="animation-delay:.4s"><rect class="tile" x="602" y="48" width="274" height="96" rx="12"/>
    <text class="num" x="620" y="88">16 alerts</text><text class="lbl" x="620" y="110">8 inhibition rules</text><text class="sub" x="620" y="128">multi-burn-rate, Slack routing by severity</text></g>

  <g class="t" style="animation-delay:.55s"><rect class="tile" x="24" y="158" width="274" height="96" rx="12"/>
    <text class="num" x="42" y="198">8</text><text class="lbl" x="42" y="220">LitmusChaos experiments</text><text class="sub" x="42" y="238">2 monitoring blind spots found and fixed</text></g>
  <g class="t" style="animation-delay:.7s"><rect class="tile" x="313" y="158" width="274" height="96" rx="12"/>
    <text class="num" x="331" y="198">3 min 17 s</text><text class="lbl" x="331" y="220">MTTA, live on-call simulation</text><text class="sub" x="331" y="238">GoAlert · ntfy · Slack ChatOps</text></g>
  <g class="t" style="animation-delay:.85s"><rect class="tile" x="602" y="158" width="274" height="96" rx="12"/>
    <text class="num" x="620" y="198">6</text><text class="lbl" x="620" y="220">Argo CD applications</text><text class="sub" x="620" y="238">selfHeal enabled to limit configuration drift</text></g>
</svg>
