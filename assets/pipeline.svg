<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" font-family="JetBrains Mono, Consolas, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/><stop offset="1" stop-color="#164E63"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="200" rx="16" fill="url(#bg)"/>
  <text x="450" y="30" text-anchor="middle" fill="#67E8F9" font-size="13" letter-spacing="2">DELIVERY &amp; OBSERVABILITY PIPELINE</text>

  <!-- ligne de flux -->
  <line x1="80" y1="100" x2="820" y2="100" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- noeuds -->
  <g font-size="12" text-anchor="middle" fill="#E2E8F0">
    <g>
      <rect x="20" y="70" width="120" height="60" rx="12" fill="#0F172A" stroke="#22D3EE" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="7.2s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <text x="80" y="96">Commit</text><text x="80" y="114" fill="#94A3B8" font-size="10">Git push</text>
    </g>
    <g>
      <rect x="147" y="70" width="120" height="60" rx="12" fill="#0F172A" stroke="#22D3EE" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="7.2s" begin="1.2s" repeatCount="indefinite"/>
      </rect>
      <text x="207" y="96">CI</text><text x="207" y="114" fill="#94A3B8" font-size="10">build · test</text>
    </g>
    <g>
      <rect x="274" y="70" width="120" height="60" rx="12" fill="#0F172A" stroke="#EF7B4D" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="7.2s" begin="2.4s" repeatCount="indefinite"/>
      </rect>
      <text x="334" y="96">Argo CD</text><text x="334" y="114" fill="#94A3B8" font-size="10">GitOps sync</text>
    </g>
    <g>
      <rect x="401" y="70" width="120" height="60" rx="12" fill="#0F172A" stroke="#326CE5" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="7.2s" begin="3.6s" repeatCount="indefinite"/>
      </rect>
      <text x="461" y="96">K3s</text><text x="461" y="114" fill="#94A3B8" font-size="10">workloads</text>
    </g>
    <g>
      <rect x="528" y="70" width="120" height="60" rx="12" fill="#0F172A" stroke="#E6522C" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="7.2s" begin="4.8s" repeatCount="indefinite"/>
      </rect>
      <text x="588" y="96">Prometheus</text><text x="588" y="114" fill="#94A3B8" font-size="10">metrics · alerts</text>
    </g>
    <g>
      <rect x="655" y="70" width="120" height="60" rx="12" fill="#0F172A" stroke="#F46800" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="7.2s" begin="6s" repeatCount="indefinite"/>
      </rect>
      <text x="715" y="96">Grafana</text><text x="715" y="114" fill="#94A3B8" font-size="10">dashboards</text>
    </g>
  </g>

  <!-- paquet qui circule -->
  <circle r="7" fill="#22D3EE" filter="url(#glow)">
    <animateMotion path="M 80 100 L 715 100" dur="7.2s" repeatCount="indefinite"/>
  </circle>

  <!-- boucle de feedback -->
  <path d="M 715 135 Q 715 175 450 175 Q 80 175 80 135" fill="none" stroke="#A78BFA" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="5 5">
    <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="450" y="193" text-anchor="middle" fill="#A78BFA" font-size="11">feedback loop : incidents &amp; SLO → prochain commit</text>
</svg>
