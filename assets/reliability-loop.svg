<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" font-family="JetBrains Mono, Consolas, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/><stop offset="1" stop-color="#1E1B2E"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="290" rx="16" fill="url(#bg)"/>
  <text x="24" y="30" fill="#F0ABFC" font-size="13" letter-spacing="2">CHAOS-VALIDATED RELIABILITY LOOP · DETECT → DIAGNOSE → REMEDIATE</text>

  <!-- ligne de flux -->
  <line x1="90" y1="105" x2="810" y2="105" stroke="#A78BFA" stroke-opacity=".4" stroke-width="2" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <g font-size="12" text-anchor="middle">
    <g><rect x="20" y="70" width="140" height="70" rx="12" fill="#0B1220" stroke="#F43F5E" stroke-width="2"><animate attributeName="stroke-opacity" values="1;.3;.3;.3;.3;1" keyTimes="0;.2;.4;.6;.8;1" dur="10s" repeatCount="indefinite"/></rect>
      <text x="90" y="96" fill="#F43F5E" font-weight="700">1 · INJECT</text><text x="90" y="114" fill="#94A3B8" font-size="10">LitmusChaos</text><text x="90" y="128" fill="#94A3B8" font-size="10">Argo Workflows</text></g>
    <g><rect x="190" y="70" width="140" height="70" rx="12" fill="#0B1220" stroke="#F59E0B" stroke-width="2"><animate attributeName="stroke-opacity" values=".3;1;.3;.3;.3;.3" keyTimes="0;.2;.4;.6;.8;1" dur="10s" repeatCount="indefinite"/></rect>
      <text x="260" y="96" fill="#F59E0B" font-weight="700">2 · DETECT</text><text x="260" y="114" fill="#94A3B8" font-size="10">burn-rate alerts</text><text x="260" y="128" fill="#94A3B8" font-size="10">Alertmanager</text></g>
    <g><rect x="360" y="70" width="140" height="70" rx="12" fill="#0B1220" stroke="#38BDF8" stroke-width="2"><animate attributeName="stroke-opacity" values=".3;.3;1;.3;.3;.3" keyTimes="0;.2;.4;.6;.8;1" dur="10s" repeatCount="indefinite"/></rect>
      <text x="430" y="96" fill="#38BDF8" font-weight="700">3 · DIAGNOSE</text><text x="430" y="114" fill="#94A3B8" font-size="10">HolmesGPT (read-only)</text><text x="430" y="128" fill="#94A3B8" font-size="10">Gemini + Qdrant RAG</text></g>
    <g><rect x="530" y="70" width="140" height="70" rx="12" fill="#0B1220" stroke="#A78BFA" stroke-width="2"><animate attributeName="stroke-opacity" values=".3;.3;.3;1;.3;.3" keyTimes="0;.2;.4;.6;.8;1" dur="10s" repeatCount="indefinite"/></rect>
      <text x="600" y="96" fill="#A78BFA" font-weight="700">4 · REMEDIATE</text><text x="600" y="114" fill="#94A3B8" font-size="10">human-reviewed PR</text><text x="600" y="128" fill="#94A3B8" font-size="10">Argo CD sync</text></g>
    <g><rect x="700" y="70" width="180" height="70" rx="12" fill="#0B1220" stroke="#22C55E" stroke-width="2"><animate attributeName="stroke-opacity" values=".3;.3;.3;.3;1;.3" keyTimes="0;.2;.4;.6;.8;1" dur="10s" repeatCount="indefinite"/></rect>
      <text x="790" y="96" fill="#22C55E" font-weight="700">5 · RE-TEST</text><text x="790" y="114" fill="#94A3B8" font-size="10">experiment re-run</text><text x="790" y="128" fill="#94A3B8" font-size="10">blind spot closed</text></g>
  </g>

  <circle r="7" fill="#F0ABFC" filter="url(#glow)"><animateMotion path="M 90 105 L 790 105" dur="10s" repeatCount="indefinite"/></circle>

  <!-- retour -->
  <path d="M 790 142 Q 790 185 450 185 Q 90 185 90 142" fill="none" stroke="#22D3EE" stroke-opacity=".6" stroke-width="2" stroke-dasharray="5 5">
    <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.2s" repeatCount="indefinite"/>
  </path>

  <!-- chiffres réels -->
  <g font-size="11" fill="#CBD5E1">
    <text x="24" y="228">▸ Detection in 2–3 min (critical) and 5–7 min (warning)</text>
    <text x="24" y="248">▸ No false positives observed in a negative-control run</text>
    <text x="24" y="268">▸ 8 experiments · 2 monitoring blind spots found, fixed and re-tested</text>
    <text x="520" y="228">▸ AI investigator is read-only: proposed fixes go through</text>
    <text x="536" y="244">human-reviewed pull requests only</text>
  </g>
</svg>
